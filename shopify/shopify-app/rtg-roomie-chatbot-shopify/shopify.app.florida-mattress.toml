# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

# Florida Mattress Shopify app config.
# Replace these values with the Florida Mattress Shopify app + Vercel deployment.
client_id = "f12e324c15018b661cc39cd62124af01"
application_url = "https://rtg-roomie-chatbot-x5el.vercel.app"
embedded = true
name = "Shop Assist"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://rtg-roomie-chatbot-x5el.vercel.app/api/shopify/webhooks/compliance"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://rtg-roomie-chatbot-x5el.vercel.app/api/shopify/webhooks/app-uninstalled"

[auth]
redirect_urls = [ "https://rtg-roomie-chatbot-x5el.vercel.app/api/shopify/callback" ]

[build]
automatically_update_urls_on_dev = true
